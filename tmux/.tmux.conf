# remap prefix
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix
# better splits
bind '\' split-window -h
bind - split-window -v
unbind '"'
unbind %
# reload
bind r source-file ~/.tmux.conf
# Switching panes with no prefix
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# Floating Window
unbind f
bind f popup -E tmux

